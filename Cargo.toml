[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/server",
    "app/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
license = "AGPL-3.0-or-later"
authors = ["kinketsu contributors"]
repository = ""

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[workspace.dependencies]
# Errors and logging
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Time / IDs
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v7", "serde"] }

# Async runtime
tokio = { version = "1", features = ["macros", "rt-multi-thread", "fs", "sync", "time"] }

# Database
sqlx = { version = "0.8", default-features = false, features = [
    "sqlite",
    "runtime-tokio",
    "chrono",
    "uuid",
    "macros",
    "migrate",
] }

# HTTP client (LLM providers, PayPal, exchange rates)
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls",
    "json",
] }

# HTTP server
axum = "0.8"
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "cors"] }

# Internal crates
kinketsu-core = { path = "crates/core" }

[profile.dev]
opt-level = 0
debug = true

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
